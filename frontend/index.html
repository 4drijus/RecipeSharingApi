<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Sharing</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <div class="container">

            <a href="#" class="logo">
                Recipe Sharing
            </a>

            <nav class="desktop-nav">

                <a href="#recipes">
                    Receptai
                </a>

                <a href="#categories">
                    Kategorijos
                </a>

                <a href="#" id="login-button">
                    Prisijungti
                </a>

                <a href="#" id="register-button">
                    Registruotis
                </a>

                <a href="#" id="logout-button" class="hidden">
                    Atsijungti
                </a>

            </nav>

            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle">
                ☰
            </button>

        </div>

    </header>


    <!-- MAIN -->
    <main class="main-content">

        <div class="container">

            <!-- HERO -->
            <section class="hero">

                <h1>
                    Receptų dalinimosi platforma
                </h1>

                <p>
                    Atraskite, kurkite ir dalinkitės savo mėgstamiausiais receptais.
                </p>

            </section>


            <!-- RECIPES -->
            <section id="recipes">

                <div class="section-header">

                    <div>
                        <h2>
                            Receptai
                        </h2>
                    </div>

                    <button
                        type="button"
                        id="add-recipe-button"
                        class="primary-button hidden">

                        + Pridėti receptą

                    </button>

                </div>


                <div
                    id="recipes-container"
                    class="recipes-grid">

                </div>


                <!-- PAGINATION -->
                <div
                    id="pagination"
                    class="pagination">

                </div>

            </section>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Recipe Sharing
            </p>

        </div>

    </footer>


    <!-- RECIPE VIEW MODAL -->
    <div
        id="recipe-modal"
        class="modal hidden">

        <div class="modal-content">

            <button
                type="button"
                id="close-modal"
                class="modal-close">

                ×

            </button>

            <h2 id="modal-title">
                Receptas
            </h2>

            <p id="modal-description">
            </p>

            <div
                id="modal-time"
                class="recipe-modal-meta">
            </div>

            <h3>
                Gaminimas
            </h3>

            <p id="modal-instructions">
            </p>

        </div>

    </div>


    <!-- ADD RECIPE MODAL -->
    <div
        id="add-recipe-modal"
        class="modal hidden">

        <div class="modal-content">

            <button
                type="button"
                id="close-add-recipe-modal"
                class="modal-close">

                ×

            </button>

            <h2>
                Pridėti receptą
            </h2>


            <form id="add-recipe-form">

                <div class="form-group">

                    <label for="recipe-title">
                        Pavadinimas
                    </label>

                    <input
                        type="text"
                        id="recipe-title"
                        name="title"
                        required>

                </div>


                <div class="form-group">

                    <label for="recipe-description">
                        Aprašymas
                    </label>

                    <textarea
                        id="recipe-description"
                        name="description"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label for="recipe-instructions">
                        Gaminimo instrukcija
                    </label>

                    <textarea
                        id="recipe-instructions"
                        name="instructions"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label for="recipe-preparation-time">
                        Paruošimo laikas (min.)
                    </label>

                    <input
                        type="number"
                        id="recipe-preparation-time"
                        name="preparationTime"
                        min="1"
                        required>

                </div>


                <div class="form-group">

                    <label for="recipe-category">
                        Kategorija
                    </label>

                    <select
                        id="recipe-category"
                        name="categoryId"
                        required>

                        <option value="">
                            Pasirinkite kategoriją
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="primary-button form-submit-button">

                    Sukurti receptą

                </button>

            </form>

        </div>

    </div>


    <!-- EDIT RECIPE MODAL -->
    <div
        id="edit-recipe-modal"
        class="modal hidden">

        <div class="modal-content">

            <button
                type="button"
                id="close-edit-recipe-modal"
                class="modal-close">

                ×

            </button>

            <h2>
                Redaguoti receptą
            </h2>


            <form id="edit-recipe-form">

                <input
                    type="hidden"
                    id="edit-recipe-id"
                    name="id">


                <div class="form-group">

                    <label for="edit-recipe-title">
                        Pavadinimas
                    </label>

                    <input
                        type="text"
                        id="edit-recipe-title"
                        name="title"
                        required>

                </div>


                <div class="form-group">

                    <label for="edit-recipe-description">
                        Aprašymas
                    </label>

                    <textarea
                        id="edit-recipe-description"
                        name="description"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label for="edit-recipe-instructions">
                        Gaminimo instrukcija
                    </label>

                    <textarea
                        id="edit-recipe-instructions"
                        name="instructions"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label for="edit-recipe-preparation-time">
                        Paruošimo laikas (min.)
                    </label>

                    <input
                        type="number"
                        id="edit-recipe-preparation-time"
                        name="preparationTime"
                        min="1"
                        required>

                </div>


                <div class="form-group">

                    <label for="edit-recipe-category">
                        Kategorija
                    </label>

                    <select
                        id="edit-recipe-category"
                        name="categoryId"
                        required>

                        <option value="">
                            Pasirinkite kategoriją
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="primary-button form-submit-button">

                    Išsaugoti pakeitimus

                </button>

            </form>

        </div>

    </div>


    <!-- LOGIN MODAL -->
    <div
        id="login-modal"
        class="modal hidden">

        <div class="modal-content">

            <button
                type="button"
                id="close-login-modal"
                class="modal-close">

                ×

            </button>

            <h2>
                Prisijungti
            </h2>


            <form id="login-form">

                <div class="form-group">

                    <label for="login-username">
                        Vartotojo vardas
                    </label>

                    <input
                        type="text"
                        id="login-username"
                        name="username"
                        required>

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Slaptažodis
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        required>

                </div>


                <button
                    type="submit"
                    class="primary-button form-submit-button">

                    Prisijungti

                </button>

            </form>

        </div>

    </div>


    <!-- REGISTER MODAL -->
    <div
        id="register-modal"
        class="modal hidden">

        <div class="modal-content">

            <button
                type="button"
                id="close-register-modal"
                class="modal-close">

                ×

            </button>

            <h2>
                Registracija
            </h2>


            <form id="register-form">

                <div class="form-group">

                    <label for="register-username">
                        Vartotojo vardas
                    </label>

                    <input
                        type="text"
                        id="register-username"
                        name="username"
                        required>

                </div>


                <div class="form-group">

                    <label for="register-email">
                        El. paštas
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        required>

                </div>


                <div class="form-group">

                    <label for="register-password">
                        Slaptažodis
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        required>

                </div>


                <button
                    type="submit"
                    class="primary-button form-submit-button">

                    Registruotis

                </button>

            </form>

        </div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
